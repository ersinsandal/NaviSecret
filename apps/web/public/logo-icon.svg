<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23D5B2"/>
      <stop offset="50%" stop-color="#38B6DB"/>
      <stop offset="100%" stop-color="#5D9CFF"/>
    </linearGradient>
    <linearGradient id="nStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background surface -->
  <rect width="512" height="512" rx="112" fill="url(#badgeGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#1E293B" stroke-width="3" opacity="0.8"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#23D5B2" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Background decorative radar rings -->
  <circle cx="256" cy="225" r="160" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="256" cy="225" r="120" fill="none" stroke="#23D5B2" stroke-width="1" opacity="0.15"/>

  <!-- Pin drop shadow -->
  <ellipse cx="256" cy="435" rx="56" ry="14" fill="#000000" opacity="0.45" filter="blur(6px)"/>

  <!-- Main Navigation Pin -->
  <path d="M 256,425
           C 244,408 148,284 148,206
           C 148,146.3 196.3,98 256,98
           C 315.7,98 364,146.3 364,206
           C 364,284 268,408 256,425 Z"
        fill="url(#pinGrad)" filter="url(#subtleGlow)"/>

  <!-- Center Secret Core / Negative Space Chamber -->
  <circle cx="256" cy="206" r="68" fill="#0B1220"/>
  <circle cx="256" cy="206" r="64" fill="#0F172A"/>

  <!-- Merged 'N' + Keyhole Emblem inside the pin core -->
  <!-- Left upright of N -->
  <path d="M 226,242 L 226,170" stroke="url(#pinGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Right upright of N -->
  <path d="M 286,242 L 286,170" stroke="url(#pinGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Diagonal connector of N -->
  <path d="M 226,174 L 286,238" stroke="url(#pinGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Keyhole opening overlaid at center -->
  <circle cx="256" cy="196" r="13" fill="#0B1220"/>
  <path d="M 250,198 L 247,222 L 265,222 L 262,198 Z" fill="#0B1220"/>
  <circle cx="256" cy="196" r="7" fill="#23D5B2"/>

  <!-- Pulse beacon dot at tip -->
  <circle cx="256" cy="425" r="3.5" fill="#5D9CFF"/>
</svg>
